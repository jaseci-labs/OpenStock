[project]
name = "openstock"
version = "0.1.0"

[check.lint]
select = ["style"]

[npm."eco/web"]
private = true
type = "module"

[npm."eco/web".dependencies]
lucide-react = "^0.544.0"
react = "^19.1.0"
react-dom = "^19.1.0"
react-router-dom = "^7.6.0"
react-select-country-list = "^2.2.4"
react-tweet = "^3.3.1"
sonner = "^2.0.8"

[npm."eco/web".devDependencies]
"@tailwindcss/vite" = "^4"
"@vitejs/plugin-react" = "^5.0.0"
tailwindcss = "^4"
tw-animate-css = "^1.4.0"
vite = "^7.1.0"

# Sign-up always sends an email address. Read from the environment where the app runs:
# SSO_GITHUB_CLIENT_ID/SECRET and SSO_GOOGLE_CLIENT_ID/SECRET turn on social sign-in;
# JAC_AUTH_ORIGIN with JAC_MAIL_HOST, JAC_MAIL_SENDER and SMTP_PASSWORD turn on reset links.
[auth.accounts]
email_required = true
